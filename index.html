<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presupuestos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Pantalla de inicio: conectar la carpeta del NAS -->
  <div id="inicio" class="inicio">
    <div class="inicio-caja">
      <h1>Presupuestos</h1>
      <p id="inicio-texto">Cargando…</p>
      <div id="inicio-botones" class="botones"></div>
      <p id="inicio-error" class="error"></p>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <!-- Barra superior -->
    <header class="barra">
      <div class="barra-titulo">
        <strong id="titulo-presupuesto">Presupuesto nuevo</strong>
        <span id="estado-guardado" class="estado"></span>
      </div>
      <nav class="barra-acciones">
        <button data-accion="nuevo" title="Nuevo presupuesto">＋ Nuevo</button>
        <button data-accion="abrir" title="Abrir un presupuesto guardado">📂 Abrir</button>
        <button data-accion="guardar" class="principal" title="Guardar (Ctrl+S)">💾 Guardar</button>
        <button data-accion="duplicar" title="Copiar este presupuesto como uno nuevo">⧉ Duplicar</button>
        <button data-accion="pdf-cliente" class="principal precio">🖨️ PDF cliente</button>
        <button data-accion="pdf-completo" class="precio">🖨️ PDF completo</button>
        <details class="menu">
          <summary>⋯</summary>
          <div class="menu-lista">
            <button data-accion="importar-plantilla">⬆️ Importar plantilla Excel</button>
            <button data-accion="descargar-plantilla" class="precio">⬇️ Descargar plantilla Excel</button>
            <button data-accion="recargar-catalogo">↻ Recargar catálogo</button>
            <button data-accion="importar-json">⬆️ Importar presupuesto (.json)</button>
            <button data-accion="importar-csv">⬆️ Importar CSV antiguo</button>
            <button data-accion="cambiar-carpeta">📁 Cambiar carpeta</button>
          </div>
        </details>
      </nav>
    </header>

    <div id="aviso-precios" class="aviso precio" hidden></div>

    <div class="cuerpo">
      <main class="principal-col">

        <!-- Datos del cliente -->
        <section class="tarjeta">
          <h2>Cliente y proyecto</h2>
          <div class="rejilla-datos">
            <label>Código cliente <input type="text" data-bind="cliente.codigo" placeholder="1000 = sin código" title="Carpeta donde se guarda. Vacío o 1000: cliente sin código"></label>
            <label>Cliente <input type="text" data-bind="cliente.nombre" placeholder="Nombre del cliente"></label>
            <label>Teléfono / email <input type="text" data-bind="cliente.contacto"></label>
            <label>Referencia <input type="text" data-bind="referencia" placeholder="Ej: Cocina Gómez"></label>
            <label>Fecha <input type="date" data-bind="fecha"></label>
            <label class="ancho-total">Descripción (sale en el PDF del cliente)
              <textarea data-bind="descripcion" rows="3" placeholder="Ej: Muebles de cocina a medida en melamina blanco mate."></textarea>
            </label>
            <div class="ancho-total planos">
              <span class="planos-titulo">Planos <small>(se añaden al final del PDF del cliente y se guarda una copia junto al presupuesto)</small></span>
              <div id="planos-lista"></div>
              <button class="anadir" data-accion="adjuntar-plano">📎 Adjuntar plano (PDF o imagen)</button>
            </div>
          </div>
        </section>

        <!-- Generador rápido de mueble -->
        <details class="tarjeta" id="generador">
          <summary><h2>Generador rápido de mueble</h2></summary>
          <div class="generador-destino">
            <label>Añadir a <select id="gm-destino"></select></label>
            <label class="crece">Nombre del mueble nuevo <input type="text" id="gm-nombre" placeholder="Ej: Armario dormitorio"></label>
          </div>
          <div class="generador">
            <div class="generador-campos">
              <label>Ancho (mm) <input type="number" id="gm-ancho" value="800" min="1"></label>
              <label>Alto (mm) <input type="number" id="gm-alto" value="2100" min="1"></label>
              <label>Fondo (mm) <input type="number" id="gm-fondo" value="600" min="1"></label>
              <label>Estantes fijos <input type="number" id="gm-fijos" value="1" min="0"></label>
              <label>Estantes móviles <input type="number" id="gm-moviles" value="2" min="0"></label>
              <label>Divisiones verticales <input type="number" id="gm-divisiones" value="0" min="0"></label>
              <label>Frontales <input type="number" id="gm-frontales" value="2" min="0"></label>
              <label>Laterales vistos <input type="number" id="gm-lat-vistos" value="0" min="0"></label>
              <label>Regletas verticales <input type="number" id="gm-reg-v" value="0" min="0"></label>
              <label>Regletas horizontales <input type="number" id="gm-reg-h" value="0" min="0"></label>
            </div>
            <div class="generador-materiales">
              <label>Interior <select id="gm-int-fam"></select><select id="gm-int-tab"></select></label>
              <label>Trasera (10 mm si existe) <select id="gm-tra-fam"></select><select id="gm-tra-tab"></select></label>
              <label>Exterior (frentes, laterales vistos, regletas) <select id="gm-ext-fam"></select><select id="gm-ext-tab"></select></label>
            </div>
            <div class="generador-vista" id="gm-vista"></div>
          </div>
          <div class="botones">
            <button class="principal" id="gm-anadir">➕ Añadir piezas del mueble</button>
            <button id="gm-limpiar">Limpiar campos</button>
          </div>
        </details>

        <!-- Muebles (apartados): cada uno con sus materiales, piezas y extras -->
        <div id="muebles"></div>
        <button class="anadir anadir-mueble" data-accion="anadir-mueble">➕ Añadir mueble</button>

        <!-- Desglose -->
        <details class="tarjeta precio" id="desglose-tarjeta">
          <summary><h2>Desglose de costes <small>(desmarca lo que no quieras cobrar)</small></h2></summary>
          <div id="desglose"></div>
        </details>
      </main>

      <!-- Resumen siempre visible -->
      <aside class="resumen precio">
        <h2>Resumen</h2>
        <div id="resumen"></div>
        <label class="descuento">
          <input type="checkbox" data-bind="recargoActivo"> Aplicar recargo por escala
        </label>
        <label class="descuento">
          <input type="checkbox" data-bind="descuento.activo"> Descuento carpintero
          <input type="number" data-bind="descuento.porcentaje" min="0" max="100" step="0.1"> %
        </label>
      </aside>
    </div>
  </div>

  <!-- Ventana para abrir presupuestos -->
  <dialog id="dialogo-abrir">
    <form method="dialog" class="dialogo-cabecera">
      <h2>Abrir presupuesto</h2>
      <button value="cancelar" aria-label="Cerrar">✕</button>
    </form>
    <input type="search" id="buscar" placeholder="Buscar por número, cliente o referencia…">
    <div id="lista-presupuestos" class="lista"></div>
  </dialog>

  <datalist id="nombres-pieza"></datalist>
  <input type="file" id="archivo-csv" accept=".csv" hidden>
  <input type="file" id="archivo-plantilla" accept=".xlsx,.xls" hidden>
  <input type="file" id="archivo-catalogo" accept=".xlsx" hidden>
  <input type="file" id="archivo-json" accept=".json" hidden>
  <input type="file" id="archivo-plano" accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.bmp" multiple hidden>

  <div id="impresion"></div>
  <div id="notificacion" class="notificacion" hidden></div>

  <script src="lib/xlsx.full.min.js"></script>
  <script src="lib/html2canvas.min.js"></script>
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/pdf-lib.min.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/calculo.js"></script>
  <script src="js/almacen.js"></script>
  <script src="js/plantilla.js"></script>
  <script src="js/imprimir.js"></script>
  <script src="js/mueble.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
